<style>

:root{
  --bg:#060912;
  --panel:#0b1220;
  --panel2:#0e1829;
  --line:#1c2b42;
  --text:#f4f8ff;
  --muted:#91a2ba;
  --cyan:#38d8ff;
  --blue:#4f7cff;
  --green:#28d17c;
  --shadow:0 24px 70px rgba(0,0,0,.42);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% -10%,#102d46 0,transparent 30%),
    radial-gradient(circle at 100% 0,#17183b 0,transparent 27%),
    var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,#000,transparent 70%);
  z-index:-1;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input{
  font:inherit;
}

.wrap{
  width:min(1240px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,9,17,.76);
  backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(120,160,210,.12);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:1000;
  font-size:22px;
  color:#fff;
}

.logo-mark{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--cyan),#5571ff);
  box-shadow:0 0 30px #38d8ff35;
}

.logo small{
  display:block;
  color:#7f91aa;
  font-size:9px;
  letter-spacing:2.4px;
  margin-top:2px;
}

.links{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.links a{
  padding:10px 13px;
  border-radius:10px;
  color:#9eacc0;
  font-weight:700;
}

.links a:hover{
  background:#111d30;
  color:#fff;
}

.nav-pill{
  border:1px solid #243751;
  background:#0c1726;
  padding:9px 13px;
  border-radius:11px;
  color:#b8c8db;
  font-size:13px;
}

/* HERO */

.hero{
  position:relative;
  min-height:545px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.hero-art{
  position:absolute;
  inset:-25px;
  background-size:cover;
  background-position:center;
  opacity:.32;
  filter:saturate(1.25);
  transition:.7s;
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 75% 45%,
      rgba(56,216,255,.16),
      transparent 27%
    ),
    linear-gradient(
      90deg,
      rgba(6,9,18,1) 0%,
      rgba(6,9,18,.82) 42%,
      rgba(6,9,18,.3) 100%
    );
  z-index:1;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    0deg,
    var(--bg),
    transparent 22%
  );
  z-index:1;
}

.hero-content{
  position:relative;
  z-index:2;
  padding:75px 0;
  max-width:790px;
}

.eyebrow{
  color:var(--cyan);
  font-size:13px;
  font-weight:1000;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.hero h1{
  font-size:clamp(48px,7vw,82px);
  line-height:.98;
  letter-spacing:-2px;
  margin:14px 0 18px;
}

.hero h1 span{
  color:var(--cyan);
}

.hero p{
  font-size:18px;
  color:#b5c3d6;
  line-height:1.95;
  max-width:690px;
}

.hero-buttons{
  display:flex;
  gap:11px;
  flex-wrap:wrap;
  margin-top:27px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:13px 19px;
  border-radius:13px;
  border:1px solid #293d5b;
  background:#101b2b;
  font-weight:900;
  transition:.2s;
}

.btn.primary{
  background:linear-gradient(
    135deg,
    var(--cyan),
    #5680ff
  );
  color:#03111b;
  border-color:transparent;
  box-shadow:0 10px 30px #38d8ff20;
}

.btn:hover{
  transform:translateY(-2px);

}

.dots{

  gap:8px;

}

.dot{

  height:4px;

  border-radius:20px;

  cursor:pointer;

}

.dot.active{

}

/* SECTION */

.head h2{

/* SEARCH */

.search{

.search input{

.filters{

.filter.active,

}

/* GAME GRID */

.grid{

}

.card{

.card:after{

    linear-gradient(
      120deg,
      transparent 35%,
      #ffffff04,
      transparent 65%

}

.card:hover{
  transform:translateY(-7px);
  border-color:#2e8fa9;
  box-shadow:0 25px 55px #0007;
}

.card:hover:after{
  transform:translateX(100%);
}

  background-position:center;
}

.cover:before{

  inset:0;

.cover-badge{

  color:#bdefff;

  font-weight:900;
}

.body{
  padding:17px;
}

.body h3{

.body p{

}

.actions{

}

.actions button,
.actions a{

.hidden{

.empty{

footer{

    <script>

        const games = {

            pes2013: {
                title: "Pro Evolution Soccer 2013",
                category: "SPORT",
                genre: "كرة القدم",
                rating: "4.8",
                image: "https://placehold.co/1200x600/111827/ffffff?text=PES+2013",
                description:
                    "استمتع بتجربة كرة القدم الكلاسيكية مع Pro Evolution Soccer 2013."
            },

            gta5: {
                title: "Grand Theft Auto V",
                category: "ACTION",
                genre: "أكشن • عالم مفتوح",
                rating: "4.9",
                image: "https://placehold.co/1200x600/111827/ffffff?text=GTA+V",
                description:
                    "عالم مفتوح مليء بالمغامرات والمهام والاستكشاف."
            },

            minecraft: {
                title: "Minecraft",
                category: "ADVENTURE",
                genre: "مغامرات • بناء",
                rating: "4.9",
                image: "https://placehold.co/1200x600/111827/ffffff?text=Minecraft",
                description:
                    "ابنِ عالمك الخاص واستكشف عوالم لا محدودة."
            },

            fifa14: {
                title: "FIFA 14",
                category: "SPORT",
                genre: "كرة القدم",
                rating: "4.7",
                image: "https://placehold.co/1200x600/111827/ffffff?text=FIFA+14",
                description:
                    "لعبة كرة قدم كلاسيكية تقدم مباريات وحماسًا كبيرًا."
            }

        };


        function openGame(gameId) {

            const game = games[gameId];

            if (!game) return;

            document.getElementById("modalTitle").textContent =
                game.title;

            document.getElementById("modalCategory").textContent =
                game.category;

            document.getElementById("modalGenre").textContent =
                game.genre;

            document.getElementById("modalRating").textContent =
                game.rating;

            document.getElementById("modalDescription").textContent =
                game.description;

            document.getElementById("modalImage").src =
                game.image;

            document.getElementById("gameModal").classList.add("active");

            document.body.classList.add("modal-open");
        }


        function closeGame() {

            document.getElementById("gameModal").classList.remove("active");

            document.body.classList.remove("modal-open");
        }


        function toggleFavorite(button) {

            button.classList.toggle("active");

            if (button.classList.contains("active")) {
                button.innerHTML = "♥";
            } else {
                button.innerHTML = "♡";
            }

        }


        function scrollToGames() {

            const gamesSection =
                document.getElementById("games");

            if (gamesSection) {
                gamesSection.scrollIntoView({
                    behavior: "smooth"
                });
            }

        }


        function showAllGames() {

            scrollToGames();

            document.querySelectorAll(".game-card")
                .forEach(card => {
                    card.style.display = "";
                });

        }


        function filterGames(category) {

            const cards =
                document.querySelectorAll(".game-card");

            cards.forEach(card => {

                const badge =
                    card.querySelector(".game-badge");

                if (!badge) return;

                const value =
                    badge.textContent.toLowerCase();

                if (
                    category === "action" &&
                    value.includes("action")
                ) {
                    card.style.display = "";
                }

                else if (
                    category === "sport" &&
                    value.includes("sport")
                ) {
                    card.style.display = "";
                }

                else if (
                    category === "adventure" &&
                    value.includes("adventure")
                ) {
                    card.style.display = "";
                }

                else if (
                    category === "racing" &&
                    value.includes("racing")
                ) {
                    card.style.display = "";
                }

                else {
                    card.style.display = "none";
                }

            });

            scrollToGames();
        }


        function downloadGame() {

            alert(
                "رابط تحميل اللعبة سيتم إضافته هنا."
            );

        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {
                    closeGame();
                }

            }
        );


        document.addEventListener(
            "DOMContentLoaded",
            function() {

                const cards =
                    document.querySelectorAll(".game-card");

                cards.forEach((card, index) => {

                    card.style.animationDelay =
                        `${index * 0.08}s`;

                });

            }
        );

    </script>

</body>
