<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تكنومسار | متجر الألعاب</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:#080b12;
 color:#fff
}
.container{
 width:92%;
 max-width:1200px;
 margin:auto
}
header{
 background:#101622;
 border-bottom:1px solid #263142;
 padding:18px 0
}
.nav{
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{
 font-size:26px;
 font-weight:bold
}
.logo span{color:#00d4ff}
nav{
 display:flex;
 gap:20px
}
nav a{color:#ddd;text-decoration:none}
.banner{
 margin:22px 0;
 border-radius:18px;
 overflow:hidden
}
.banner img{
 width:100%;
 height:220px;
 object-fit:cover;
 display:block
}
.hero{
 min-height:330px;
 border-radius:20px;
 overflow:hidden;
 position:relative;
 background:
 linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.85)),
 url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1400&q=80")
 center/cover
}
.hero-content{
 padding:80px 7%;
 max-width:650px
}
.hero h1{
 font-size:42px;
 margin:0 0 15px
}
.hero p{
 color:#ddd;
 font-size:17px
}
.btn{
 border:0;
 padding:12px 18px;
 border-radius:10px;
 cursor:pointer;
 font-weight:bold
}
.primary{
 background:#6c5ce7;
 color:white
}
.secondary{
 background:#202a39;
 color:white
}
.section{
 padding:45px 0
}
.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px
}
.search{
 width:100%;
 padding:14px;
 background:#111722;
 border:1px solid #263142;
 border-radius:12px;
 color:white;
 margin-bottom:15px
}
.filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:25px
}
.filter{
 padding:10px 15px;
 border-radius:10px;
 border:1px solid #263142;
 background:#111722;
 color:#ddd;
 cursor:pointer
}
.filter.active{
 background:#6c5ce7;
 color:white
}
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:18px
}
.card{
 background:#111722;
 border:1px solid #263142;
 border-radius:16px;
 overflow:hidden;
 transition:.2s
}
.card:hover{
 transform:translateY(-4px)
}
.card img{
 width:100%;
 height:190px;
 object-fit:cover
}
.card-body{
 padding:16px
}
.card h3{
 margin:0 0 8px;
 font-size:19px
}
.info{
 color:#9aa6b7;
 font-size:14px;
 margin-bottom:12px
}
.rating{
 color:#ffd166;
 margin-bottom:10px
}
.actions{
 display:flex;
 gap:8px
}
.actions button{
 flex:1
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.8);
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:20px
}
.modal.show{
 display:flex
}
.modal-box{
 width:min(600px,100%);
 background:#111722;
 border-radius:18px;
 overflow:hidden;
 border:1px solid #263142
}
.modal-box img{
 width:100%;
 height:250px;
 object-fit:cover
}
.modal-body{
 padding:20px
}
.close{
 float:left;
 border:0;
 background:#263142;
 color:white;
 width:40px;
 height:40px;
 border-radius:9px;
 cursor:pointer;
 font-size:20px
}
footer{
 border-top:1px solid #263142;
 padding:30px 0;
 text-align:center;
 color:#9aa6b7
}
@media(max-width:850px){
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
 nav{display:none}
 .grid{grid-template-columns:1fr}
 .hero h1{font-size:30px}
 .banner img{height:150px}
}
</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">🎮 تكنو<span>مسار</span></div>

<nav>
<a href="#home">الرئيسية</a>
<a href="#games">الألعاب</a>
<a href="#about">عن المتجر</a>
</nav>
</div>
</header>

<main id="home" class="container">

<!-- البانر -->
<div class="banner">
<img src="images/banner.jpg" alt="تكنومسار">
</div>

<section class="hero">
<div class="hero-content">
<h1>عالم الألعاب بين يديك 🎮</h1>
<p>اكتشف ألعابك المفضلة من متجر تكنومسار.</p>
<button class="btn primary" onclick="scrollToGames()">
تصفح الألعاب
</button>
</div>
</section>

<section id="games" class="section">

<div class="section-title">
<h2>الألعاب 🎮</h2>
<span id="count">5 ألعاب</span>
</div>

<input
id="search"
class="search"
placeholder="ابحث عن لعبة..."
oninput="applyFilters()"
>

<div class="filters">

<button class="filter active"
onclick="setCategory('all',this)">
الكل
</button>

<button class="filter"
onclick="setCategory('action',this)">
أكشن
</button>

<button class="filter"
onclick="setCategory('sport',this)">
رياضة
</button>

<button class="filter"
onclick="setCategory('adventure',this)">
مغامرات
</button>

<button class="filter"
onclick="setCategory('racing',this)">
سباقات
</button>

</div>

<div id="games" class="grid"></div>

</section>

<section id="about" class="section">
<h2>عن تكنومسار</h2>
<p class="info">
متجر ألعاب عربي بتصميم بسيط وسهل الاستخدام.
</p>
</section>

</main>

<!-- التفاصيل -->
<div id="modal" class="modal">

<div class="modal-box">

<img id="modalImage" src="" alt="">

<div class="modal-body">

<button class="close" onclick="closeModal()">×</button>

<h2 id="modalTitle"></h2>

<p id="modalDescription" class="info"></p>

<button
id="modalDownload"
class="btn primary">
تحميل اللعبة
</button>

</div>

</div>

</div>

<footer>
© 2026 تكنومسار — تصميم وتطوير: محمد حامد
</footer>

<script>

const gamesData = [

{
id:"truckArab",
title:"محاكي الشاحنات الدول العربية",
category:"racing",
image:"https://raw.githubusercontent.com/Mohamed-tool-grafix/technomasar/main/images.jpeg",
rating:"4.8",
description:"لعبة محاكاة الشاحنات الدول العربية.",
download:"https://c.go4techno.com/abokreeem-833"
},

{
id:"pes2013",
title:"Pro Evolution Soccer 2013",
category:"sport",
image:"https://raw.githubusercontent.com/Mohamed-tool-grafix/technomasar/main/file_00000000a93c820aba7a6e700e553412.png",
rating:"4.8",
description:"لعبة كرة القدم Pro Evolution Soccer 2013.",
download:"https://youssefsayed2003.blogspot.com/2025/03/2013.html"
},

{
id:"gta5",
title:"Grand Theft Auto V",
category:"action",
image:"https://cdn.cloudflare.steamstatic.com/steam/apps/271590/header.jpg",
rating:"4.9",
description:"لعبة أكشن وعالم مفتوح.",
download:"https://uptogames.net/download-grand-theft-auto-v-free/"
},

{
id:"minecraft",
title:"Minecraft",
category:"adventure",
image:"https://cdn.cloudflare.steamstatic.com/steam/apps/1672970/header.jpg",
rating:"4.9",
description:"لعبة بناء واستكشاف ومغامرات.",
download:"https://www.mediafire.com/file/vjxqehwjsnyp3mo/MCPE-Patched-1.21.100.apk/file"
},

{
id:"fifa14",
title:"FIFA 14",
category:"sport",
image:"https://raw.githubusercontent.com/Mohamed-tool-grafix/technomasar/main/images%20(1).jpeg",
rating:"4.7",
description:"لعبة كرة القدم FIFA 14.",
download:"https://uptogames.net/download-fifa-14-for-pc/"
}

];

let category="all";

function render(list){

const box=document.getElementById("games");

document.getElementById("count").textContent=
list.length+" ألعاب";

if(list.length===0){

box.innerHTML=
"<p style='color:#aaa'>لا توجد ألعاب.</p>";

return;
}

box.innerHTML=list.map(game=>`

<div class="card">

<img src="${game.image}" alt="${game.title}">

<div class="card-body">

<h3>${game.title}</h3>

<div class="rating">
★ ${game.rating}
</div>

<div class="info">
${game.description}
</div>

<div class="actions">

<button
class="btn primary"
onclick="openModal('${game.id}')">
التفاصيل
</button>

<button
class="btn secondary"
onclick="downloadGame('${game.id}')">
تحميل
</button>

</div>

</div>

</div>

`).join("");

}

function setCategory(cat,button){

category=cat;

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

applyFilters();

}

function applyFilters(){

const text=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const list=gamesData.filter(game=>{

const categoryOK=
category==="all" ||
game.category===category;

const searchOK=
game.title.toLowerCase().includes(text);

return categoryOK && searchOK;

});

render(list);

}

function downloadGame(id){

const game=gamesData.find(x=>x.id===id);

if(game){
window.open(game.download,"_blank");
}

}

function openModal(id){

const game=gamesData.find(x=>x.id===id);

if(!game)return;

document.getElementById("modalImage").src=game.image;

document.getElementById("modalTitle")
.textContent=game.title;

document.getElementById("modalDescription")
.textContent=
"★ "+game.rating+" — "+game.description;

document.getElementById("modalDownload")
.onclick=()=>downloadGame(id);

document.getElementById("modal")
.classList.add("show");

}

function closeModal(){

document.getElementById("modal")
.classList.remove("show");

}

function scrollToGames(){

document.getElementById("games")
.scrollIntoView({
behavior:"smooth"
});

}

document.getElementById("modal")
.addEventListener("click",function(e){

if(e.target===this){
closeModal();
}

});

render(gamesData);

</script>

</body>
</html>
