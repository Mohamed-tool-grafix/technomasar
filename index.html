<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تكنومسار | 3D Runner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    overflow:hidden;
    background:#050816;
    font-family:Arial,"Segoe UI",sans-serif;
    color:white;
}

#game{
    position:fixed;
    inset:0;
}

#ui{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    gap:12px;
    direction:rtl;
}

.box{
    background:rgba(5,10,25,.82);
    border:1px solid rgba(97,231,255,.35);
    backdrop-filter:blur(10px);
    padding:10px 18px;
    border-radius:14px;
    font-weight:bold;
}

#message{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.5);
}

.panel{
    width:min(420px,90%);
    padding:30px;
    text-align:center;
    border-radius:25px;
    background:linear-gradient(145deg,#101c38,#080d1e);
    border:1px solid #18c5eb;
    box-shadow:0 20px 70px #000;
}

.panel h1{
    color:#61e7ff;
    font-size:38px;
    margin-bottom:12px;
}

.panel p{
    color:#aebbd0;
    line-height:1.8;
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:13px;
    padding:13px 28px;
    background:#18c5eb;
    color:#03111b;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

button:hover{
    background:#61e7ff;
    transform:translateY(-2px);
}

#gameOver{
    display:none;
}

#hint{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:#cbd5e1;
    background:rgba(0,0,0,.45);
    padding:9px 16px;
    border-radius:20px;
    font-size:14px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">
    <div class="box">🏆 النقاط: <span id="score">0</span></div>
    <div class="box">🪙 العملات: <span id="coins">0</span></div>
</div>

<div id="hint">
    🖱️ حرّك الماوس يمين ويسار للتحرك
</div>

<div id="message">

    <div class="panel" id="startPanel">
        <h1>🏃 Runner 3D</h1>
        <p>
            لعبة جري ثلاثية الأبعاد أصلية.
            تحرك بين المسارات واجمع العملات
            وتجنب القطارات والعوائق.
        </p>

        <button onclick="startGame()">
            ▶ ابدأ اللعب
        </button>
    </div>

    <div class="panel" id="gameOver">
        <h1>💥 انتهت اللعبة</h1>

        <p>
            نتيجتك:
            <strong id="finalScore">0</strong>
            <br>
            العملات:
            <strong id="finalCoins">0</strong>
        </p>

        <button onclick="startGame()">
            🔄 العب مرة أخرى
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   إعداد المشهد
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07111f);

scene.fog = new THREE.Fog(
    0x07111f,
    20,
    150
);

const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    .1,
    300
);

camera.position.set(0,5.5,10);
camera.lookAt(0,1,-15);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================
   الإضاءة
========================= */

const ambient = new THREE.HemisphereLight(
    0x9edfff,
    0x080b18,
    2
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(5,12,10);

light.castShadow = true;

scene.add(light);


/* =========================
   الأرض والسكك
========================= */

const road = new THREE.Mesh(
    new THREE.BoxGeometry(15,.3,180),
    new THREE.MeshStandardMaterial({
        color:0x101827
    })
);

road.position.set(0,-.25,-55);

road.receiveShadow = true;

scene.add(road);


/* خطوط المسارات */

const laneLines = [];

for(let z=5;z>-160;z-=8){

    [-1.5,1.5].forEach(x=>{

        const line = new THREE.Mesh(
            new THREE.BoxGeometry(.08,.03,4),
            new THREE.MeshBasicMaterial({
                color:0x18c5eb
            })
        );

        line.position.set(x,0,z);

        scene.add(line);

        laneLines.push(line);

    });
}


/* القضبان */

for(let x of [-5.2,-1.7,1.7,5.2]){

    const rail = new THREE.Mesh(
        new THREE.BoxGeometry(.12,.15,180),
        new THREE.MeshStandardMaterial({
            color:0x8899aa,
            metalness:.8
        })
    );

    rail.position.set(x,.05,-55);

    scene.add(rail);
}


/* =========================
   شخصية اللاعب
========================= */

const player = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.BoxGeometry(.8,1.25,.55),
    new THREE.MeshStandardMaterial({
        color:0x18c5eb,
        roughness:.4
    })
);

body.position.y=.8;

body.castShadow=true;

player.add(body);


/* الرأس */

const head = new THREE.Mesh(
    new THREE.SphereGeometry(.38,24,24),
    new THREE.MeshStandardMaterial({
        color:0xffc49a
    })
);

head.position.y=1.7;

head.castShadow=true;

player.add(head);


/* الشعر */

const hair = new THREE.Mesh(
    new THREE.SphereGeometry(.4,20,12),
    new THREE.MeshStandardMaterial({
        color:0x171717
    })
);

hair.scale.y=.45;

hair.position.y=1.95;

player.add(hair);


/* الأرجل */

for(let x of [-.22,.22]){

    const leg = new THREE.Mesh(
        new THREE.BoxGeometry(.2,.7,.25),
        new THREE.MeshStandardMaterial({
            color:0x263b62
        })
    );

    leg.position.set(x,.0,0);

    leg.castShadow=true;

    player.add(leg);
}

player.position.set(0,0,5);

scene.add(player);


/* =========================
   عناصر اللعبة
========================= */

let obstacles=[];
let coins=[];
let trains=[];

const lanes=[-3.4,0,3.4];

let currentLane=1;
let targetX=0;

let score=0;
let coinCount=0;

let speed=.45;

let running=false;

let spawnTimer=0;


/* =========================
   إنشاء عملة
========================= */

function createCoin(){

    const coin = new THREE.Mesh(
        new THREE.TorusGeometry(
            .35,
            .09,
            12,
            24
        ),
        new THREE.MeshStandardMaterial({
            color:0xffd21c,
            emissive:0x8a5b00
        })
    );

    coin.rotation.y=Math.PI/2;

    coin.position.set(
        lanes[
            Math.floor(Math.random()*3)
        ],
        1,
        -100
    );

    coin.castShadow=true;

    scene.add(coin);

    coins.push(coin);
}


/* =========================
   إنشاء حاجز
========================= */

function createObstacle(){

    const obstacle = new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            1.3,
            1.3
        ),
        new THREE.MeshStandardMaterial({
            color:0xef4444
        })
    );

    obstacle.position.set(
        lanes[
            Math.floor(Math.random()*3)
        ],
        .65,
        -100
    );

    obstacle.castShadow=true;

    scene.add(obstacle);

    obstacles.push(obstacle);
}


/* =========================
   إنشاء قطار
========================= */

function createTrain(){

    const train = new THREE.Group();

    const main = new THREE.Mesh(
        new THREE.BoxGeometry(
            2.7,
            2.8,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x7c3aed,
            metalness:.2
        })
    );

    main.position.y=1.4;

    main.castShadow=true;

    train.add(main);


    const front = new THREE.Mesh(
        new THREE.BoxGeometry(
            2.2,
            .8,
            .2
        ),
        new THREE.MeshStandardMaterial({
            color:0x61e7ff,
            emissive:0x075985
        })
    );

    front.position.set(0,1.5,-4.1);

    train.add(front);

    train.position.set(
        lanes[
            Math.floor(Math.random()*3)
        ],
        0,
        -120
    );

    scene.add(train);

    trains.push(train);
}


/* =========================
   التحكم بالماوس
========================= */

document.addEventListener(
    "mousemove",
    e => {

        if(!running) return;

        const center =
            innerWidth / 2;

        const difference =
            e.clientX - center;

        if(difference < -150){
            currentLane=0;
        }
        else if(difference > 150){
            currentLane=2;
        }
        else{
            currentLane=1;
        }

        targetX=lanes[currentLane];
    }
);


/* =========================
   لمس الموبايل
========================= */

let touchStartX=0;

document.addEventListener(
    "touchstart",
    e => {
        touchStartX =
            e.touches[0].clientX;
    }
);

document.addEventListener(
    "touchend",
    e => {

        if(!running) return;

        const end =
            e.changedTouches[0].clientX;

        const diff =
            end-touchStartX;

        if(diff>50)
            currentLane=Math.min(
                2,
                currentLane+1
            );

        if(diff<-50)
            currentLane=Math.max(
                0,
                currentLane-1
            );

        targetX=lanes[currentLane];
    }
);


/* =========================
   بدء اللعبة
========================= */

function startGame(){

    obstacles.forEach(x=>scene.remove(x));
    coins.forEach(x=>scene.remove(x));
    trains.forEach(x=>scene.remove(x));

    obstacles=[];
    coins=[];
    trains=[];

    score=0;
    coinCount=0;
    speed=.45;
    spawnTimer=0;

    currentLane=1;
    targetX=0;

    player.position.x=0;

    document.getElementById("score")
        .textContent=0;

    document.getElementById("coins")
        .textContent=0;

    document.getElementById("message")
        .style.display="none";

    running=true;
}


/* =========================
   Game Over
========================= */

function gameOver(){

    running=false;

    document.getElementById("finalScore")
        .textContent=Math.floor(score);

    document.getElementById("finalCoins")
        .textContent=coinCount;

    document.getElementById("gameOver")
        .style.display="block";

    document.getElementById("startPanel")
        .style.display="none";

    document.getElementById("message")
        .style.display="flex";
}


/* =========================
   التصادم
========================= */

function collision(a,b){

    const box1 =
        new THREE.Box3()
        .setFromObject(a);

    const box2 =
        new THREE.Box3()
        .setFromObject(b);

    return box1.intersectsBox(box2);
}


/* =========================
   تحديث اللعبة
========================= */

function updateGame(){

    if(!running) return;


    /* حركة اللاعب */

    player.position.x +=
        (targetX-player.position.x)
        *.16;


    /* زيادة السرعة */

    speed += .00035;

    score += speed;

    document.getElementById("score")
        .textContent=Math.floor(score);


    /* Spawn */

    spawnTimer += speed;

    if(spawnTimer>25){

        spawnTimer=0;

        const random =
            Math.random();

        if(random<.45){
            createObstacle();
        }
        else if(random<.75){
            createCoin();
        }
        else{
            createTrain();
        }
    }


    /* تحريك العوائق */

    obstacles.forEach(
        obstacle => {

            obstacle.position.z += speed;

            obstacle.rotation.y += .01;

            if(collision(
                player,
                obstacle
            )){
                gameOver();
            }
        }
    );


    /* تحريك القطارات */

    trains.forEach(
        train => {

            train.position.z +=
                speed*.85;

            if(collision(
                player,
                train
            )){
                gameOver();
            }
        }
    );


    /* العملات */

    coins.forEach(
        coin => {

            coin.position.z += speed;

            coin.rotation.x += .08;
            coin.rotation.z += .05;

            if(collision(
                player,
                coin
            )){

                coinCount++;

                document.getElementById("coins")
                    .textContent=coinCount;

                coin.position.z=1000;
            }
        }
    );


    /* حذف العناصر القديمة */

    obstacles =
        obstacles.filter(
            obstacle => {

                if(obstacle.position.z>15){

                    scene.remove(obstacle);

                    return false;
                }

                return true;
            }
        );


    trains =
        trains.filter(
            train => {

                if(train.position.z>15){

                    scene.remove(train);

                    return false;
                }

                return true;
            }
        );


    coins =
        coins.filter(
            coin => {

                if(coin.position.z>15){

                    scene.remove(coin);

                    return false;
                }

                return true;
            }
        );


    /* حركة خطوط الطريق */

    laneLines.forEach(
        line => {

            line.position.z += speed;

            if(line.position.z>10)
                line.position.z=-160;
        }
    );


    /* اهتزاز بسيط للشخصية */

    player.rotation.z =
        Math.sin(
            Date.now()*.008
        )*.035;

    player.position.y =
        Math.abs(
            Math.sin(
                Date.now()*.012
            )
        )*.05;

}


/* =========================
   الكاميرا
========================= */

function updateCamera(){

    camera.position.x +=
        (player.position.x-camera.position.x)
        *.06;

    camera.lookAt(
        player.position.x,
        1,
        -18
    );
}


/* =========================
   Loop
========================= */

function animate(){

    requestAnimationFrame(animate);

    updateGame();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================
   تغيير حجم الشاشة
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
