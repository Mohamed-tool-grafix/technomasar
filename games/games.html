<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ألعاب مجانية للكمبيوتر والموبايل | تكنومسار</title>

<meta name="description"
content="تكنومسار - اكتشف ألعاب مجانية ومفتوحة المصدر للكمبيوتر والموبايل.">

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#070b18;
    color:white;
    line-height:1.7;
}

a{
    text-decoration:none;
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:9999;
    background:rgba(7,11,24,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #263653;
}

.header-content{
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    color:#61e7ff;
    font-size:25px;
    font-weight:900;
}

.nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.nav a{
    color:#cbd5e1;
    padding:9px 13px;
    border-radius:10px;
    font-weight:bold;
}

.nav a:hover{
    color:#61e7ff;
    background:#111b30;
}

/* ================= HERO ================= */

.hero{
    padding:80px 0 65px;
    text-align:center;

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(24,197,235,.16),
        transparent 30%
    ),
    radial-gradient(
        circle at 80% 20%,
        rgba(117,87,255,.18),
        transparent 35%
    );
}

.badge{
    display:inline-block;
    padding:7px 15px;
    border-radius:50px;
    background:rgba(24,197,235,.1);
    border:1px solid rgba(24,197,235,.3);
    color:#61e7ff;
    font-weight:bold;
    margin-bottom:15px;
}

.hero h1{
    font-size:clamp(40px,7vw,65px);
    margin:0 0 15px;
}

.hero h1 span{
    color:#61e7ff;
}

.hero p{
    max-width:760px;
    margin:auto;
    color:#94a3bd;
    font-size:18px;
}

/* ================= SEARCH ================= */

.search-area{
    margin:30px auto 0;
    max-width:750px;
}

.search-box{
    width:100%;
    padding:16px 20px;
    border-radius:15px;
    border:1px solid #263653;
    outline:none;
    background:#111b30;
    color:white;
    font-size:16px;
    text-align:right;
}

.search-box:focus{
    border-color:#18c5eb;
    box-shadow:0 0 20px rgba(24,197,235,.12);
}

.search-box::placeholder{
    color:#718096;
}

/* ================= FILTERS ================= */

.filters{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.filter-btn{
    border:1px solid #263653;
    background:#111b30;
    color:#cbd5e1;
    padding:9px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.filter-btn:hover,
.filter-btn.active{
    background:#18c5eb;
    color:#03111b;
    border-color:#18c5eb;
}

/* ================= COUNTER ================= */

.counter{
    margin-top:20px;
    color:#94a3bd;
}

.counter strong{
    color:#61e7ff;
}

/* ================= SECTIONS ================= */

.section{
    padding:70px 0;
}

.mobile-section{
    background:#0b1222;
    border-top:1px solid rgba(255,255,255,.06);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.section-head{
    margin-bottom:30px;
}

.section-title{
    margin:0;
    color:#61e7ff;
    font-size:35px;
}

.section-description{
    color:#94a3bd;
    margin:5px 0 0;
}

/* ================= GAMES ================= */

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.game-card{
    background:linear-gradient(145deg,#111b30,#0d1528);
    border:1px solid #263653;
    border-radius:20px;
    padding:22px;
    text-align:center;
    transition:.3s;
}

.game-card:hover{
    transform:translateY(-7px);
    border-color:#18c5eb;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
}

.game-icon{
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:75px;
    border-radius:17px;
    background:linear-gradient(135deg,#075985,#312e81);
}

.mobile-icon{
    background:linear-gradient(135deg,#166534,#075985);
}

.game-card h3{
    color:#61e7ff;
    font-size:25px;
    margin:18px 0 8px;
}

.description{
    color:#b7c3d7;
    min-height:90px;
}

.tags{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    margin:18px 0;
}

.tags span{
    background:#17243d;
    color:#cbd5e1;
    padding:5px 9px;
    border-radius:8px;
    font-size:12px;
}
