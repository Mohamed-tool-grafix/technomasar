```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تكنومسار | الألعاب</title>

    <meta name="description"
          content="متجر تكنومسار للألعاب">

    <!-- ملف التصميم الرئيسي -->
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="container header-inner">

        <a href="../index.html" class="logo">
            🎮 تكنومسار
        </a>

        <nav class="menu">

            <a href="../index.html">
                🏠 الرئيسية
            </a>

            <a href="games.html" class="active">
                🎮 الألعاب
            </a>

            <a href="../index.html#categories">
                📂 التصنيفات
            </a>

            <a href="../index.html#about">
                ℹ️ عن الموقع
            </a>

        </nav>

        <button id="menuBtn"
                class="menu-btn"
                type="button">
            ☰
        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

    <!-- عنوان الصفحة -->

    <section class="page-hero">

        <div class="container">

            <h1>
                🎮 متجر الألعاب
            </h1>

            <p>
                اكتشف ألعابك المفضلة وابحث عنها بسهولة
            </p>

        </div>

    </section>


    <!-- =========================
         SEARCH
    ========================= -->

    <section class="games-section">

        <div class="container">

            <div class="games-tools">

                <div class="search-box">

                    <input
                        type="search"
                        id="gameSearch"
                        placeholder="🔎 ابحث عن لعبة..."
                        autocomplete="off"
                    >

                </div>


                <!-- =========================
                     FILTERS
                ========================= -->

                <div class="filters">

                    <button
                        type="button"
                        class="filter-btn active-filter"
                        data-category="all">
                        الكل
                    </button>

                    <button
                        type="button"
                        class="filter-btn"
                        data-category="action">
                        أكشن
                    </button>

                    <button
                        type="button"
                        class="filter-btn"
                        data-category="sports">
                        رياضة
                    </button>

                    <button
                        type="button"
                        class="filter-btn"
                        data-category="adventure">
                        مغامرات
                    </button>

                    <button
                        type="button"
                        class="filter-btn"
                        data-category="racing">
                        سباقات
                    </button>

                    <button
                        type="button"
                        class="filter-btn"
                        data-category="simulation">
                        محاكاة
                    </button>

                </div>

            </div>


            <!-- عدد الألعاب -->

            <div class="games-count">

                <span id="gameCount">
                    0 لعبة
                </span>

            </div>


            <!-- =========================
                 GAMES GRID
            ========================= -->

            <div
                id="gamesGrid"
                class="games-grid">
            </div>


            <!-- لا توجد نتائج -->

            <div
                id="noGames"
                class="no-games"
                style="display:none;">

                <div class="no-games-icon">
                    🎮
                </div>

                <h2>
                    لا توجد ألعاب
                </h2>

                <p>
                    جرّب البحث عن لعبة أخرى أو اختر تصنيفًا مختلفًا.
                </p>

            </div>

        </div>

    </section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="container">

        <p>
            © 2026 تكنومسار - متجر الألعاب
        </p>

    </div>

</footer>


<!-- =========================
     JAVASCRIPT
========================= -->

<script src="games.js"></script>

</body>
</html>
```
